<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Panel</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: radial-gradient(circle at top, #050b1f, #01040d 80%);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
}

/* Glow background */
body::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(0,120,255,0.2), transparent);
    animation: pulse 6s infinite;
}

@keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.4); opacity: 0.2; }
}

/* Container */
.container {
    width: 95%;
    max-width: 400px;
    padding: 20px;
    border-radius: 20px;
    background: rgba(10, 20, 50, 0.6);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 60px rgba(0,120,255,0.25);
    z-index: 2;
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    font-size: 20px;
    letter-spacing: 3px;
    color: #4ea1ff;
}

.header p {
    font-size: 11px;
    color: #7c8bb3;
    letter-spacing: 4px;
}

/* Card */
.card {
    background: rgba(0,0,0,0.5);
    border-radius: 15px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: 0.3s;
    border: 1px solid rgba(255,255,255,0.05);
}

.card:hover {
    box-shadow: 0 0 25px rgba(0,120,255,0.3);
}

/* Header clickable */
.card-header {
    padding: 15px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.card-header span {
    font-size: 14px;
}

/* Arrow */
.arrow {
    transition: 0.3s;
}

/* Content */
.card-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    padding: 0 15px;
}

/* Active */
.card.active .card-content {
    max-height: 200px;
    padding-bottom: 15px;
}

.card.active .arrow {
    transform: rotate(180deg);
}

/* Code */
.code {
    font-size: 11px;
    font-family: monospace;
    background: rgba(5,5,15,0.9);
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
    word-break: break-all;
}

/* Button */
.btn {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #2b6cff, #4fa3ff);
    color: white;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 0 15px rgba(0,120,255,0.5);
}

.btn:hover {
    transform: scale(1.03);
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>AVAILABLE SCRIPTS</h1>
        <p>CONTROL PANEL</p>
    </div>

    <!-- CARD -->
    <div class="card" onclick="toggle(this)">
        <div class="card-header">
            <span>SAB PVP ENGINE ⚔️</span>
            <span class="arrow">▼</span>
        </div>
        <div class="card-content">
            <div class="code" id="code1">
-- isi script
            </div>
            <button class="btn" onclick="copy(event,'code1')">COPY</button>
        </div>
    </div>

    <!-- CARD -->
    <div class="card" onclick="toggle(this)">
        <div class="card-header">
            <span>SAB FREEZE TRADE ❄️</span>
            <span class="arrow">▼</span>
        </div>
        <div class="card-content">
            <div class="code" id="code2">
-- isi script
            </div>
            <button class="btn" onclick="copy(event,'code2')">COPY</button>
        </div>
    </div>

    <!-- CARD -->
    <div class="card" onclick="toggle(this)">
        <div class="card-header">
            <span>Brainrot Duper 🧠</span>
            <span class="arrow">▼</span>
        </div>
        <div class="card-content">
            <div class="code" id="code3">
-- isi script
            </div>
            <button class="btn" onclick="copy(event,'code3')">COPY</button>
        </div>
    </div>

</div>

<script>
function toggle(card) {
    card.classList.toggle("active");
}

function copy(e, id) {
    e.stopPropagation();
    let text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text);
    alert("Copied!");
}
</script>

</body>
</html>
